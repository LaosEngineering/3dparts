<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3DParts - Soluzioni e Servizi</title>
    
    <style>
        :root {
            --bg-dark: #070b14;
            --accent-cyan: #0ea5e9;
            --accent-blue: #0366d6;
            --glass-bg: rgba(13, 20, 36, 0.78);
            --glass-border: rgba(56, 189, 248, 0.2);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* Canvas Background Dinamico a tutto schermo */
        #print-bg-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Elevazione contenuti sopra il background */
        header, main {
            position: relative;
            z-index: 10;
        }

        header {
            background: rgba(10, 16, 30, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            color: white;
            padding: 20px 0;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .admin-btn {
            color: white;
            text-decoration: none;
            background: var(--accent-blue);
            border: 1px solid rgba(56, 189, 248, 0.4);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .admin-btn:hover {
            background: var(--accent-cyan);
            box-shadow: 0 0 15px rgba(14, 165, 233, 0.4);
        }

        main {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px 60px 20px;
        }

        h2 {
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 10px;
            margin-top: 40px;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        /* Griglia Prodotti */
        .griglia-prodotti {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.25s ease, border-color 0.25s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-cyan);
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 15px;
            background: #1e293b;
        }

        .card h3 {
            margin: 10px 0 8px 0;
            color: #ffffff;
        }

        .card p {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.5;
            margin: 0;
        }

        .badge {
            background-color: rgba(14, 165, 233, 0.18);
            border: 1px solid var(--accent-cyan);
            color: #38bdf8;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 8px;
        }

        /* Form Contatti */
        form {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 600px;
            margin: 20px auto;
        }

        input, textarea {
            background: rgba(7, 11, 20, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.28);
            color: #ffffff;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input::placeholder, textarea::placeholder {
            color: #64748b;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(14, 165, 233, 0.2);
        }

        button[type="submit"] {
            background-color: var(--accent-blue);
            color: white;
            border: 1px solid rgba(56, 189, 248, 0.4);
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button[type="submit"]:hover {
            background-color: var(--accent-cyan);
            box-shadow: 0 0 15px rgba(14, 165, 233, 0.4);
        }

        #statoInvio {
            text-align: center;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- Background Animato Multi-Parti a Tutta Pagina -->
    <canvas id="print-bg-canvas"></canvas>

    <header>
        <div class="header-content">
            <div>
                <h1 style="margin: 0; font-size: 24px; letter-spacing: 0.5px;">Laos Engineering / 3DParts</h1>
                <p style="margin: 5px 0 0 0; color: #38bdf8; font-size: 14px;">Stampe 3D Personalizzate</p>
            </div>
            <div>
                <a href="admin.html" class="admin-btn">Area Admin</a>
            </div>
        </div>
    </header>

    <main>
        <!-- Sezione Catalogo dinamico da Firebase -->
        <section>
            <h2>I nostri Prodotti e Servizi</h2>
            <div id="catalogo-container" class="griglia-prodotti">
                <p style="color: #94a3b8;">Caricamento catalogo in corso...</p>
            </div>
        </section>

        <!-- Sezione Form Contatti collegata a Firebase -->
        <section>
            <h2>Commissiona Progetto</h2>
            <form id="formContatto">
                <input type="text" id="nome" placeholder="Il tuo Nome o Azienda" required>
                <input type="email" id="email" placeholder="La tua Email" required>
                <textarea id="messaggio" rows="4" placeholder="Descrivi il tuo progetto..." required></textarea>
                <button type="submit">Invia Richiesta</button>
                <p id="statoInvio"></p>
            </form>
        </section>
    </main>

    <!-- Script Animazione Background 3D Slicer Multi-Parti -->
    <script>
        (function() {
            const canvas = document.getElementById('print-bg-canvas');
            const ctx = canvas.getContext('2d');

            let width, height, dpr;
            let mouse = { x: 0, y: 0, targetX: 0, targetY: 0 };
            let time = 0;

            // Configurazione più lenta, ampia e discreta
            const config = {
                printSpeed: 0.065,      // Velocità di stampa molto rilassata
                rotationSpeed: 0.035,   // Rotazione leggera della visuale
                baseOpacity: 0.22       // Opacità soffusa per non disturbare il testo
            };

            // 7 Parti distribuite su tutto il piano di stampa
            const parts = [
                { type: 'gear',     nx: -0.36, nz: -0.25, radius: 68, height: 85,  layers: 26, phase: 0.0 },
                { type: 'vase',     nx:  0.34, nz: -0.22, radius: 62, height: 125, layers: 34, phase: 0.35 },
                { type: 'cube',     nx: -0.32, nz:  0.26, radius: 58, height: 95,  layers: 28, phase: 0.65 },
                { type: 'cylinder', nx:  0.35, nz:  0.24, radius: 64, height: 105, layers: 30, phase: 0.15 },
                { type: 'helix',    nx:  0.00, nz: -0.34, radius: 52, height: 115, layers: 32, phase: 0.50 },
                { type: 'prism',    nx: -0.02, nz:  0.32, radius: 60, height: 90,  layers: 26, phase: 0.80 },
                { type: 'turbine',  nx:  0.00, nz:  0.00, radius: 74, height: 110, layers: 30, phase: 0.25 }
            ];

            function resize() {
                dpr = Math.min(window.devicePixelRatio || 1, 2);
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width * dpr;
                canvas.height = height * dpr;
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }

            window.addEventListener('resize', resize);
            window.addEventListener('mousemove', (e) => {
                mouse.targetX = (e.clientX / width - 0.5) * 2;
                mouse.targetY = (e.clientY / height - 0.5) * 2;
            });
            resize();

            // Proiezione 3D -> 2D centrata su tutto lo schermo
            function project(x, y, z, rotY, tiltX) {
                const cosY = Math.cos(rotY);
                const sinY = Math.sin(rotY);
                const rx = x * cosY - z * sinY;
                const rz = x * sinY + z * cosY;

                const cosX = Math.cos(tiltX);
                const sinX = Math.sin(tiltX);
                const ry = y * cosX - rz * sinX;
                const finalZ = y * sinX + rz * cosX;

                const fov = 950;
                const scale = fov / (fov + finalZ + 450);

                return {
                    x: (width * 0.5) + rx * scale,
                    y: (height * 0.54) - ry * scale,
                    scale: scale
                };
            }

            // Genera i punti del profilo per ciascun tipo di parte meccanica
            function getPartLayerPoints(part, layerIdx, cx, cz) {
                const progress = layerIdx / part.layers;
                const y = progress * part.height;
                const pts = [];
                let segments = 36;

                if (part.type === 'cube') segments = 4;
                if (part.type === 'prism') segments = 6;

                for (let i = 0; i <= segments; i++) {
                    const t = i / segments;
                    const angle = t * Math.PI * 2;
                    let r = part.radius;
                    let a = angle;

                    switch (part.type) {
                        case 'gear':
                            // Ingranaggio meccanico a 12 denti
                            const tooth = Math.sin(angle * 12) > 0 ? 7 : -3;
                            r = part.radius * 0.85 + tooth;
                            break;
                        case 'vase':
                            // Vaso parametrico ritorto
                            r = part.radius * (0.72 + 0.28 * Math.sin(progress * Math.PI * 1.3));
                            r += Math.cos(angle * 6 + progress * 3) * 6;
                            break;
                        case 'cube':
                            // Cubo con leggera torsione (Voronoi/CAD)
                            a = angle + Math.PI / 4 + progress * 0.35;
                            r = part.radius * 1.15;
                            break;
                        case 'cylinder':
                            // Cilindro scanalato
                            r = part.radius * (0.92 + 0.08 * Math.cos(angle * 8));
                            break;
                        case 'helix':
                            // Elica ritorta a 3 lobi
                            r = part.radius * (0.75 + 0.25 * Math.cos(angle * 3 - progress * Math.PI * 2));
                            break;
                        case 'prism':
                            // Prisma esagonale rastremato
                            r = part.radius * (1.05 - progress * 0.35);
                            break;
                        case 'turbine':
                            // Girante a pale curve
                            r = part.radius * (0.8 + 0.22 * Math.sin(angle * 7 + progress * Math.PI * 1.5));
                            break;
                    }

                    pts.push({
                        x: cx + Math.cos(a) * r,
                        y: y,
                        z: cz + Math.sin(a) * r
                    });
                }
                return pts;
            }

            // Disegna la grande griglia CAD su tutta la pagina
            function drawFullBuildPlate(spreadX, spreadZ, rotY, tiltX) {
                const step = 75;
                const maxX = Math.ceil(spreadX / step) * step;
                const maxZ = Math.ceil(spreadZ / step) * step;

                ctx.lineWidth = 1;

                for (let x = -maxX; x <= maxX; x += step) {
                    const isAxis = x === 0;
                    ctx.strokeStyle = isAxis ? 'rgba(56, 189, 248, 0.14)' : 'rgba(56, 189, 248, 0.045)';
                    const p1 = project(x, 0, -maxZ, rotY, tiltX);
                    const p2 = project(x, 0, maxZ, rotY, tiltX);
                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.stroke();
                }

                for (let z = -maxZ; z <= maxZ; z += step) {
                    const isAxis = z === 0;
                    ctx.strokeStyle = isAxis ? 'rgba(56, 189, 248, 0.14)' : 'rgba(56, 189, 248, 0.045)';
                    const p1 = project(-maxX, 0, z, rotY, tiltX);
                    const p2 = project(maxX, 0, z, rotY, tiltX);
                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.stroke();
                }
            }

            function animate() {
                time += 0.016;
                mouse.x += (mouse.targetX - mouse.x) * 0.03;
                mouse.y += (mouse.targetY - mouse.y) * 0.03;

                // Sfondo uniforme scuro e pulito
                const grad = ctx.createRadialGradient(width * 0.5, height * 0.5, 80, width * 0.5, height * 0.5, Math.max(width, height) * 0.85);
                grad.addColorStop(0, '#0c1426');
                grad.addColorStop(1, '#050811');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, width, height);

                // Rotazione molto lenta e parallasse morbida
                const rotY = Math.sin(time * config.rotationSpeed) * 0.35 + mouse.x * 0.22;
                const tiltX = 0.48 + mouse.y * 0.08;

                // Adatta l'ampiezza del piatto alle dimensioni della finestra
                const spreadX = Math.max(width * 0.65, 520);
                const spreadZ = Math.max(height * 0.55, 380);

                drawFullBuildPlate(spreadX, spreadZ, rotY, tiltX);

                // Disegna ciascuna delle 7 parti
                parts.forEach((part) => {
                    const cx = part.nx * spreadX;
                    const cz = part.nz * spreadZ;

                    // Ciclo di stampa lento e sfalsato per ogni oggetto
                    const cycle = part.layers + 14;
                    const rawProgress = ((time * config.printSpeed * 10) + part.phase * cycle) % cycle;
                    const activeLayer = Math.min(Math.floor(rawProgress), part.layers - 1);
                    const layerFrac = rawProgress - Math.floor(rawProgress);

                    // 1. Guida wireframe sottilissima dell'oggetto completo
                    ctx.lineWidth = 0.6;
                    ctx.strokeStyle = 'rgba(56, 189, 248, 0.04)';
                    for (let l = activeLayer + 1; l < part.layers; l += 3) {
                        const pts = getPartLayerPoints(part, l, cx, cz);
                        ctx.beginPath();
                        pts.forEach((pt, idx) => {
                            const proj = project(pt.x, pt.y, pt.z, rotY, tiltX);
                            if (idx === 0) ctx.moveTo(proj.x, proj.y);
                            else ctx.lineTo(proj.x, proj.y);
                        });
                        ctx.stroke();
                    }

                    // 2. Strati stampati
                    for (let l = 0; l <= activeLayer; l++) {
                        const pts = getPartLayerPoints(part, l, cx, cz);
                        const isCurrent = (l === activeLayer && rawProgress < part.layers);
                        const maxIdx = isCurrent ? Math.max(1, Math.floor(pts.length * layerFrac)) : pts.length - 1;

                        // Riempimento interno (infill) discreto ogni 5 strati
                        if (l % 5 === 0 && !isCurrent && pts.length > 6) {
                            ctx.strokeStyle = 'rgba(14, 165, 233, 0.06)';
                            ctx.lineWidth = 0.7;
                            const pA = project(pts[0].x, pts[0].y, pts[0].z, rotY, tiltX);
                            const mid = Math.floor(pts.length / 2);
                            const pB = project(pts[mid].x, pts[mid].y, pts[mid].z, rotY, tiltX);
                            ctx.beginPath();
                            ctx.moveTo(pA.x, pA.y);
                            ctx.lineTo(pB.x, pB.y);
                            ctx.stroke();
                        }

                        ctx.lineWidth = isCurrent ? 1.5 : 1.0;
                        ctx.strokeStyle = isCurrent
                            ? 'rgba(125, 211, 252, 0.55)'
                            : `rgba(14, 165, 233, ${0.10 + (l / part.layers) * config.baseOpacity})`;

                        ctx.beginPath();
                        for (let i = 0; i <= maxIdx; i++) {
                            const proj = project(pts[i].x, pts[i].y, pts[i].z, rotY, tiltX);
                            if (i === 0) ctx.moveTo(proj.x, proj.y);
                            else ctx.lineTo(proj.x, proj.y);

                            // Punto luminoso delicato dove sta lavorando l'estrusore
                            if (isCurrent && i === maxIdx) {
                                ctx.save();
                                ctx.fillStyle = 'rgba(186, 230, 253, 0.75)';
                                ctx.beginPath();
                                ctx.arc(proj.x, proj.y, 2.2, 0, Math.PI * 2);
                                ctx.fill();
                                ctx.restore();
                            }
                        }
                        ctx.stroke();
                    }
                });

                requestAnimationFrame(animate);
            }

            animate();
        })();
    </script>

    <!-- Script JavaScript per connettersi a Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Configurazione Firebase presa dal tuo pannello
        const firebaseConfig = {
            apiKey: "AIzaSyChYUANJ02DAZZd3FOiu0Fbuv8KeooVW98",
            authDomain: "laosbackend.firebaseapp.com",
            projectId: "laosbackend",
            storageBucket: "laosbackend.firebasestorage.app",
            messagingSenderId: "971024190529",
            appId: "1:971024190529:web:2408cf4b0c86a6d924cac0"
        };

        // Inizializzazione
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 1. CARICAMENTO CATALOGO DA FIRESTORE
        async function caricaCatalogo() {
            const container = document.getElementById("catalogo-container");
            try {
                const querySnapshot = await getDocs(collection(db, "catalogo"));
                if (querySnapshot.empty) {
                    container.innerHTML = "<p style='color: #94a3b8;'>Nessun prodotto disponibile al momento.</p>";
                    return;
                }
                
                container.innerHTML = ""; // Pulisce il testo di caricamento
                querySnapshot.forEach((doc) => {
                    const item = doc.data();
                    const imgTag = item.immagineUrl 
                        ? `<img src="${item.immagineUrl}" alt="${item.Titolo || 'Prodotto'}" onerror="this.style.display='none'">` 
                        : '';
                    container.innerHTML += `
                        <article class="card">
                            <div>
                                ${imgTag}
                                <span class="badge">${item.Categoria || 'Generale'}</span>
                                <h3>${item.Titolo || 'Senza titolo'}</h3>
                                <p>${item.Descrizione || ''}</p>
                            </div>
                        </article>
                    `;
                });
            } catch (errore) {
                console.error("Errore nel caricamento:", errore);
                container.innerHTML = "<p style='color: #f87171;'>Errore nel caricamento del catalogo.</p>";
            }
        }

        // 2. GESTIONE INVIO FORM CONTATTI
        document.getElementById("formContatto").addEventListener("submit", async (e) => {
            e.preventDefault();
            const stato = document.getElementById("statoInvio");
            stato.textContent = "Invio in corso...";
            stato.style.color = "#38bdf8";

            try {
                await addDoc(collection(db, "richieste_contatto"), {
                    nome: document.getElementById("nome").value,
                    email: document.getElementById("email").value,
                    messaggio: document.getElementById("messaggio").value,
                    dataInvio: serverTimestamp()
                });
                stato.textContent = "Richiesta inviata con successo! Ti ricontatteremo presto.";
                stato.style.color = "#4ade80";
                e.target.reset();
            } catch (errore) {
                console.error("Errore nell'invio:", errore);
                stato.textContent = "Errore durante l'invio. Riprova più tardi.";
                stato.style.color = "#f87171";
            }
        });

        // Avvia la lettura del database all'apertura della pagina
        caricaCatalogo();
    </script>
</body>
</html>
