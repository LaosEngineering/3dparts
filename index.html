<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3DParts - Soluzioni e Servizi</title>
    
    <style>
        :root {
            --bg-dark: #070b14;
            --accent-cyan: #0ea5e9;
            --accent-blue: #0366d6;
            --glass-bg: rgba(15, 23, 42, 0.72);
            --glass-border: rgba(56, 189, 248, 0.22);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* Canvas Background Dinamico */
        #print-bg-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Elevazione contenuti sopra il background */
        header, main {
            position: relative;
            z-index: 10;
        }

        header {
            background: rgba(11, 17, 32, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            color: white;
            padding: 20px 0;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .admin-btn {
            color: white;
            text-decoration: none;
            background: var(--accent-blue);
            border: 1px solid rgba(56, 189, 248, 0.4);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .admin-btn:hover {
            background: var(--accent-cyan);
            box-shadow: 0 0 15px rgba(14, 165, 233, 0.4);
        }

        main {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px 60px 20px;
        }

        h2 {
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 10px;
            margin-top: 40px;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        /* Griglia Prodotti */
        .griglia-prodotti {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.25s ease, border-color 0.25s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-cyan);
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 15px;
            background: #1e293b;
        }

        .card h3 {
            margin: 10px 0 8px 0;
            color: #ffffff;
        }

        .card p {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.5;
            margin: 0;
        }

        .badge {
            background-color: rgba(14, 165, 233, 0.2);
            border: 1px solid var(--accent-cyan);
            color: #38bdf8;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 8px;
        }

        /* Form Contatti */
        form {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 600px;
            margin: 20px auto;
        }

        input, textarea {
            background: rgba(7, 11, 20, 0.75);
            border: 1px solid rgba(148, 163, 184, 0.3);
            color: #ffffff;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input::placeholder, textarea::placeholder {
            color: #64748b;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(14, 165, 233, 0.2);
        }

        button[type="submit"] {
            background-color: var(--accent-blue);
            color: white;
            border: 1px solid rgba(56, 189, 248, 0.4);
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button[type="submit"]:hover {
            background-color: var(--accent-cyan);
            box-shadow: 0 0 15px rgba(14, 165, 233, 0.4);
        }

        #statoInvio {
            text-align: center;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- Background Animato Stampa 3D -->
    <canvas id="print-bg-canvas"></canvas>

    <header>
        <div class="header-content">
            <div>
                <h1 style="margin: 0; font-size: 24px; letter-spacing: 0.5px;">Laos Engineering / 3DParts</h1>
                <p style="margin: 5px 0 0 0; color: #38bdf8; font-size: 14px;">Stampe 3D Personalizzate</p>
            </div>
            <div>
                <a href="admin.html" class="admin-btn">Area Admin</a>
            </div>
        </div>
    </header>

    <main>
        <!-- Sezione Catalogo dinamico da Firebase -->
        <section>
            <h2>I nostri Prodotti e Servizi</h2>
            <div id="catalogo-container" class="griglia-prodotti">
                <p style="color: #94a3b8;">Caricamento catalogo in corso...</p>
            </div>
        </section>

        <!-- Sezione Form Contatti collegata a Firebase -->
        <section>
            <h2>Commissiona Progetto</h2>
            <form id="formContatto">
                <input type="text" id="nome" placeholder="Il tuo Nome o Azienda" required>
                <input type="email" id="email" placeholder="La tua Email" required>
                <textarea id="messaggio" rows="4" placeholder="Descrivi il tuo progetto..." required></textarea>
                <button type="submit">Invia Richiesta</button>
                <p id="statoInvio"></p>
            </form>
        </section>
    </main>

    <!-- Script Animazione Background 3D Slicer -->
    <script>
        (function() {
            const canvas = document.getElementById('print-bg-canvas');
            const ctx = canvas.getContext('2d');

            let width, height, dpr;
            let mouse = { x: 0, y: 0, targetX: 0, targetY: 0 };
            let time = 0;
            let particles = [];

            const config = {
                layers: 52,
                layerHeight: 4.2,
                radius: 135,
                speed: 0.28, // Velocità di stampa strati
                rotationSpeed: 0.0025
            };

            function resize() {
                dpr = Math.min(window.devicePixelRatio || 1, 2);
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width * dpr;
                canvas.height = height * dpr;
                ctx.scale(dpr, dpr);
            }

            window.addEventListener('resize', resize);
            window.addEventListener('mousemove', (e) => {
                mouse.targetX = (e.clientX / width - 0.5) * 2;
                mouse.targetY = (e.clientY / height - 0.5) * 2;
            });
            resize();

            // Proiezione isometrica/prospettica 3D -> 2D
            function project(x, y, z, rotY, tiltX) {
                // Rotazione asse Y
                const cosY = Math.cos(rotY);
                const sinY = Math.sin(rotY);
                const rx = x * cosY - z * sinY;
                const rz = x * sinY + z * cosY;

                // Inclinazione piano di stampa
                const cosX = Math.cos(tiltX);
                const sinX = Math.sin(tiltX);
                const ry = y * cosX - rz * sinX;
                const finalZ = y * sinX + rz * cosX;

                const fov = 750;
                const scale = fov / (fov + finalZ + 400);

                // Posiziona l'oggetto leggermente decentrato a destra su schermi grandi
                const offsetX = width > 768 ? width * 0.68 : width * 0.5;
                const offsetY = height * 0.62;

                return {
                    x: offsetX + rx * scale,
                    y: offsetY - ry * scale,
                    scale: scale
                };
            }

            // Genera i punti di un singolo strato (Vaso Parametrica Tech)
            function getLayerPoints(layerIndex, totalLayers, segments = 48) {
                const progress = layerIndex / totalLayers;
                const y = layerIndex * config.layerHeight - (totalLayers * config.layerHeight) * 0.35;
                // Profilo sinuoso + svasatura tech
                const baseR = config.radius * (0.75 + 0.3 * Math.sin(progress * Math.PI * 1.35));
                const twist = progress * Math.PI * 0.85;
                const pts = [];

                for (let i = 0; i <= segments; i++) {
                    const angle = (i / segments) * Math.PI * 2;
                    // Nervature geometriche stile stampa 3D industriale
                    const wave = Math.cos(angle * 8 + twist) * 10 * Math.sin(progress * Math.PI);
                    const r = baseR + wave;
                    pts.push({
                        x: Math.cos(angle) * r,
                        y: y,
                        z: Math.sin(angle) * r
                    });
                }
                return pts;
            }

            // Disegna il piatto di stampa riscaldato (Build Plate)
            function drawBuildPlate(rotY, tiltX) {
                const gridSize = 240;
                const step = 40;
                ctx.lineWidth = 1;

                for (let i = -gridSize; i <= gridSize; i += step) {
                    const isMainAxis = i === 0;
                    ctx.strokeStyle = isMainAxis ? 'rgba(56, 189, 248, 0.25)' : 'rgba(56, 189, 248, 0.08)';

                    // Linee X
                    const p1 = project(-gridSize, -75, i, rotY, tiltX);
                    const p2 = project(gridSize, -75, i, rotY, tiltX);
                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.stroke();

                    // Linee Z
                    const p3 = project(i, -75, -gridSize, rotY, tiltX);
                    const p4 = project(i, -75, gridSize, rotY, tiltX);
                    ctx.beginPath();
                    ctx.moveTo(p3.x, p3.y);
                    ctx.lineTo(p4.x, p4.y);
                    ctx.stroke();
                }
            }

            // Particelle termiche/scintille dell'estrusore
            function spawnParticle(x, y) {
                if (particles.length > 35) return;
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 1.8,
                    vy: -Math.random() * 1.5 - 0.3,
                    life: 1.0,
                    size: Math.random() * 2.2 + 1
                });
            }

            function updateAndDrawParticles() {
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life -= 0.025;

                    if (p.life <= 0) {
                        particles.splice(i, 1);
                        continue;
                    }

                    ctx.fillStyle = `rgba(56, 189, 248, ${p.life * 0.8})`;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            function animate() {
                time += 0.016;
                mouse.x += (mouse.targetX - mouse.x) * 0.05;
                mouse.y += (mouse.targetY - mouse.y) * 0.05;

                // Sfondo radiale scuro profondo
                const grad = ctx.createRadialGradient(width * 0.7, height * 0.5, 50, width * 0.5, height * 0.5, width * 0.9);
                grad.addColorStop(0, '#0f172a');
                grad.addColorStop(1, '#050811');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, width, height);

                const rotY = time * 0.25 + mouse.x * 0.45;
                const tiltX = 0.42 + mouse.y * 0.15;

                drawBuildPlate(rotY, tiltX);

                // Ciclo continuo di stampa (da 0 a totalLayers, poi reset morbido)
                const cycleLength = config.layers + 18;
                const currentPrintProgress = (time * config.speed * 12) % cycleLength;
                const activeLayer = Math.min(Math.floor(currentPrintProgress), config.layers - 1);
                const layerFraction = currentPrintProgress - Math.floor(currentPrintProgress);

                // 1. Disegna anteprima wireframe (G-Code ghost) degli strati futuri
                ctx.lineWidth = 0.7;
                for (let l = activeLayer + 1; l < config.layers; l += 2) {
                    const pts = getLayerPoints(l, config.layers, 32);
                    ctx.strokeStyle = 'rgba(56, 189, 248, 0.06)';
                    ctx.beginPath();
                    pts.forEach((pt, idx) => {
                        const proj = project(pt.x, pt.y, pt.z, rotY, tiltX);
                        if (idx === 0) ctx.moveTo(proj.x, proj.y);
                        else ctx.lineTo(proj.x, proj.y);
                    });
                    ctx.stroke();
                }

                // 2. Disegna gli strati già stampati
                for (let l = 0; l <= activeLayer; l++) {
                    const pts = getLayerPoints(l, config.layers, 48);
                    const isCurrent = (l === activeLayer && currentPrintProgress < config.layers);
                    const maxIdx = isCurrent ? Math.floor(pts.length * layerFraction) : pts.length - 1;

                    // Riempimento interno (Infill pattern) ogni 4 strati
                    if (l % 4 === 0 && !isCurrent) {
                        ctx.strokeStyle = 'rgba(14, 165, 233, 0.12)';
                        ctx.lineWidth = 0.8;
                        for (let k = 0; k < pts.length; k += 6) {
                            const pA = project(pts[k].x, pts[k].y, pts[k].z, rotY, tiltX);
                            const pB = project(pts[(k + 20) % pts.length].x, pts[k].y, pts[(k + 20) % pts.length].z, rotY, tiltX);
                            ctx.beginPath();
                            ctx.moveTo(pA.x, pA.y);
                            ctx.lineTo(pB.x, pB.y);
                            ctx.stroke();
                        }
                    }

                    // Perimetro estruso
                    ctx.lineWidth = isCurrent ? 2.2 : 1.3;
                    ctx.strokeStyle = isCurrent
                        ? 'rgba(125, 211, 252, 0.95)'
                        : `rgba(14, 165, 233, ${0.22 + (l / config.layers) * 0.35})`;

                    ctx.beginPath();
                    for (let i = 0; i <= maxIdx; i++) {
                        const proj = project(pts[i].x, pts[i].y, pts[i].z, rotY, tiltX);
                        if (i === 0) ctx.moveTo(proj.x, proj.y);
                        else ctx.lineTo(proj.x, proj.y);

                        // Posizione dell'ugello (Nozzle)
                        if (isCurrent && i === maxIdx) {
                            // Raggio laser/testina dall'alto
                            const nozzleTop = project(pts[i].x, pts[i].y + 180, pts[i].z, rotY, tiltX);
                            const laserGrad = ctx.createLinearGradient(nozzleTop.x, nozzleTop.y, proj.x, proj.y);
                            laserGrad.addColorStop(0, 'rgba(56, 189, 248, 0)');
                            laserGrad.addColorStop(1, 'rgba(125, 211, 252, 0.75)');

                            ctx.save();
                            ctx.strokeStyle = laserGrad;
                            ctx.lineWidth = 2;
                            ctx.beginPath();
                            ctx.moveTo(nozzleTop.x, nozzleTop.y);
                            ctx.lineTo(proj.x, proj.y);
                            ctx.stroke();

                            // Bagliore punta estrusore
                            ctx.fillStyle = '#ffffff';
                            ctx.shadowColor = '#38bdf8';
                            ctx.shadowBlur = 15;
                            ctx.beginPath();
                            ctx.arc(proj.x, proj.y, 3.5, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.restore();

                            if (Math.random() > 0.45) spawnParticle(proj.x, proj.y);
                        }
                    }
                    ctx.stroke();
                }

                updateAndDrawParticles();
                requestAnimationFrame(animate);
            }

            animate();
        })();
    </script>

    <!-- Script JavaScript per connettersi a Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Configurazione Firebase presa dal tuo pannello
        const firebaseConfig = {
            apiKey: "AIzaSyChYUANJ02DAZZd3FOiu0Fbuv8KeooVW98",
            authDomain: "laosbackend.firebaseapp.com",
            projectId: "laosbackend",
            storageBucket: "laosbackend.firebasestorage.app",
            messagingSenderId: "971024190529",
            appId: "1:971024190529:web:2408cf4b0c86a6d924cac0"
        };

        // Inizializzazione
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 1. CARICAMENTO CATALOGO DA FIRESTORE
        async function caricaCatalogo() {
            const container = document.getElementById("catalogo-container");
            try {
                const querySnapshot = await getDocs(collection(db, "catalogo"));
                if (querySnapshot.empty) {
                    container.innerHTML = "<p style='color: #94a3b8;'>Nessun prodotto disponibile al momento.</p>";
                    return;
                }
                
                container.innerHTML = ""; // Pulisce il testo di caricamento
                querySnapshot.forEach((doc) => {
                    const item = doc.data();
                    container.innerHTML += `
                        <article class="card">
                            <div>
                                <img src="${item.immagineUrl || 'https://placehold.co/400x250/1e293b/38bdf8?text=3DParts'}" alt="${item.Titolo || 'Prodotto'}">
                                <span class="badge">${item.Categoria || 'Generale'}</span>
                                <h3>${item.Titolo || 'Senza titolo'}</h3>
                                <p>${item.Descrizione || ''}</p>
                            </div>
                        </article>
                    `;
                });
            } catch (errore) {
                console.error("Errore nel caricamento:", errore);
                container.innerHTML = "<p style='color: #f87171;'>Errore nel caricamento del catalogo.</p>";
            }
        }

        // 2. GESTIONE INVIO FORM CONTATTI
        document.getElementById("formContatto").addEventListener("submit", async (e) => {
            e.preventDefault();
            const stato = document.getElementById("statoInvio");
            stato.textContent = "Invio in corso...";
            stato.style.color = "#38bdf8";

            try {
                await addDoc(collection(db, "richieste_contatto"), {
                    nome: document.getElementById("nome").value,
                    email: document.getElementById("email").value,
                    messaggio: document.getElementById("messaggio").value,
                    dataInvio: serverTimestamp()
                });
                stato.textContent = "Richiesta inviata con successo! Ti ricontatteremo presto.";
                stato.style.color = "#4ade80";
                e.target.reset();
            } catch (errore) {
                console.error("Errore nell'invio:", errore);
                stato.textContent = "Errore durante l'invio. Riprova più tardi.";
                stato.style.color = "#f87171";
            }
        });

        // Avvia la lettura del database all'apertura della pagina
        caricaCatalogo();
    </script>
</body>
</html>
